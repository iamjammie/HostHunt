[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hosthunt"
version = "0.1.0"
description = "Host/endpoint artefact collection and analysis for incident response (companion to FluxHunt)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cyphora.ops" }]
keywords = ["dfir", "incident-response", "forensics", "mitre-attack", "threat-hunting", "endpoint"]
dependencies = []  # standard library only

[project.optional-dependencies]
evtx = ["python-evtx>=0.7"]   # only needed to parse binary .evtx files offline
test = ["pytest>=7"]

[project.scripts]
hosthunt = "hosthunt.cli:main"

[tool.setuptools.packages.find]
include = ["hosthunt*"]
